<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #map { width: 100%; height: 100%; font-family: system-ui, sans-serif; }
    .map-legend {
      position: absolute; bottom: 12px; left: 12px; z-index: 1000;
      background: rgba(255,255,255,0.95); padding: 10px 12px; border-radius: 8px;
      font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .map-legend span { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
    .map-title {
      position: absolute; top: 12px; left: 50px; z-index: 1000;
      background: rgba(255,255,255,0.95); padding: 8px 14px; border-radius: 8px;
      font-weight: 600; font-size: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .leaflet-popup-content { font-size: 13px; line-height: 1.4; max-width: 240px; }
    .leaflet-popup-content b { color: #1d3557; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="map-title" id="mapTitle"></div>
  <div class="map-legend" id="mapLegend"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const MAP_DATA = __MAP_DATA__;

    const TYPE_LABELS = {
      destination: "Destination",
      attraction: "Attraction",
      gem: "Hidden gem",
      itinerary: "Itinerary stop",
      hotel: "Hotel",
      restaurant: "Restaurant",
    };

    const map = L.map("map", { zoomControl: true }).setView(
      MAP_DATA.center || [20.5937, 78.9629],
      MAP_DATA.zoom || 10
    );

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);

    document.getElementById("mapTitle").textContent =
      MAP_DATA.mapLabel || MAP_DATA.destination || "India Travel Map";

    const usedTypes = new Set();
    const layers = [];

    (MAP_DATA.markers || []).forEach((m) => {
      usedTypes.add(m.type);
      const icon = L.divIcon({
        className: "",
        html: `<div style="background:${m.color};width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>`,
        iconSize: [14, 14],
        iconAnchor: [7, 7],
      });
      const popup = `<b>${m.name}</b><br><small>${TYPE_LABELS[m.type] || m.type}</small>` +
        (m.desc ? `<br>${m.desc}` : "");
      const marker = L.marker([m.lat, m.lng], { icon }).bindPopup(popup).addTo(map);
      layers.push(marker);
    });

    if (MAP_DATA.route && MAP_DATA.route.length === 2) {
      L.polyline(MAP_DATA.route, {
        color: "#457b9d",
        weight: 4,
        opacity: 0.75,
        dashArray: "8, 8",
      }).addTo(map);
      const bounds = L.latLngBounds(MAP_DATA.route);
      map.fitBounds(bounds, { padding: [40, 40] });
    } else if (layers.length > 1) {
      const group = L.featureGroup(layers);
      map.fitBounds(group.getBounds().pad(0.15));
    } else if (MAP_DATA.center) {
      map.setView(MAP_DATA.center, MAP_DATA.zoom || 11);
    }

    const legendEl = document.getElementById("mapLegend");
    let legendHtml = "";
    usedTypes.forEach((t) => {
      const sample = (MAP_DATA.markers || []).find((x) => x.type === t);
      if (sample) {
        legendHtml += `<div><span style="background:${sample.color}"></span>${TYPE_LABELS[t] || t}</div>`;
      }
    });
    legendEl.innerHTML = legendHtml || "<div>Select a destination to view the map</div>";

    setTimeout(() => map.invalidateSize(), 300);
  </script>
</body>
</html>
